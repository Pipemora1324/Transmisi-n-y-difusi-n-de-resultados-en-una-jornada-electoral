name: preconteo
x-app: &app
  build: .
  init: true
  restart: unless-stopped
  env_file: .env
  environment: &app-env
    PORT: 3000
    REDIS_URL: redis://redis:6379
    EXPECTED_INSTANCES: 8
  depends_on:
    redis:
      condition: service_healthy
  stop_grace_period: 10s
services:
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 2s
      retries: 10
    restart: unless-stopped
  app1:
    <<: *app
    environment: { <<: *app-env, INSTANCE_ID: app-1 }
  app2:
    <<: *app
    environment: { <<: *app-env, INSTANCE_ID: app-2 }
  app3:
    <<: *app
    environment: { <<: *app-env, INSTANCE_ID: app-3 }
  app4:
    <<: *app
    environment: { <<: *app-env, INSTANCE_ID: app-4 }
  app5:
    <<: *app
    environment: { <<: *app-env, INSTANCE_ID: app-5 }
  app6:
    <<: *app
    environment: { <<: *app-env, INSTANCE_ID: app-6 }
  app7:
    <<: *app
    environment: { <<: *app-env, INSTANCE_ID: app-7 }
  app8:
    <<: *app
    environment: { <<: *app-env, INSTANCE_ID: app-8 }
  nginx:
    image: nginx:1.28-alpine
    ports: ['${HTTP_BIND:-127.0.0.1}:8080:80']
    volumes: ['./nginx/nginx.conf:/etc/nginx/nginx.conf:ro']
    depends_on: [app1, app2, app3, app4, app5, app6, app7, app8]
    restart: unless-stopped
volumes:
  redis-data:
