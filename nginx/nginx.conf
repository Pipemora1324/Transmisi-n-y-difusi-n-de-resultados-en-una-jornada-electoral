events { worker_connections 8192; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  map $http_upgrade $connection_upgrade { default upgrade; '' ''; }
  upstream instances {
    # Round-robin: no ip_hash, cookies de afinidad ni sesiones pegajosas.
    server app1:3000 max_fails=2 fail_timeout=5s;
    server app2:3000 max_fails=2 fail_timeout=5s;
    server app3:3000 max_fails=2 fail_timeout=5s;
    server app4:3000 max_fails=2 fail_timeout=5s;
    server app5:3000 max_fails=2 fail_timeout=5s;
    server app6:3000 max_fails=2 fail_timeout=5s;
    server app7:3000 max_fails=2 fail_timeout=5s;
    server app8:3000 max_fails=2 fail_timeout=5s;
    keepalive 64;
  }
  server {
    listen 80;
    server_tokens off;
    client_max_body_size 64k;
    location / {
      proxy_pass http://instances;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 75s;
      proxy_send_timeout 75s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
    }
  }
}
